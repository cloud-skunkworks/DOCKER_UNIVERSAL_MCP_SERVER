name: verify-demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt -c requirements.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Tests and architecture checks
        run: ./scripts/verify.ps1
      - name: Build and start container
        run: |
          docker compose config --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Compose configuration' }
          docker compose up --build --wait --wait-timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'Container startup failed' }
      - name: MCP container smoke test
        run: |
          python examples/agent_client.py
          if ($LASTEXITCODE -ne 0) { throw 'MCP container smoke test failed' }
      - name: Stop container
        if: always()
        run: docker compose down
